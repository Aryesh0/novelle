<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novelle - Register</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #fff5f0 0%, #e3f2fd 50%, #f3e5f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .logo svg {
            width: 40px;
            height: 40px;
        }

        .logo h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #ff6b35 0%, #5b7cff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: #ff6b35;
            background: white;
        }

        .password-strength {
            margin-top: 10px;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        .strength-text {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }

        .weak {
            background: #ff4444;
            color: #ff4444;
        }

        .medium {
            background: #ffbb33;
            color: #ffbb33;
        }

        .strong {
            background: #00C851;
            color: #00C851;
        }

        .star-rating {
            margin-top: 10px;
        }

        .star-rating label {
            margin-bottom: 10px;
        }

        .stars {
            display: flex;
            gap: 8px;
            font-size: 32px;
            cursor: pointer;
        }

        .star {
            color: #ddd;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .star:hover,
        .star.active {
            color: #ffd700;
            transform: scale(1.1);
        }

        .star.hovered {
            color: #ffd700;
        }

        .rating-text {
            margin-top: 8px;
            font-size: 13px;
            color: #666;
            font-style: italic;
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff6b35 0%, #5b7cff 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #ff6b35;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <h1>Novelle</h1>
        </div>

        <h2>Create Your Account</h2>

        <div class="success-message" id="successMessage">
            Registration successful! Welcome to Novelle.
        </div>

        <form id="registrationForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Choose a username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a strong password">
                <div class="password-strength" id="passwordStrength">
                    <div class="password-strength-bar" id="passwordStrengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="form-group star-rating">
                <label>Rate your reading frequency:</label>
                <div class="stars" id="starRating">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
                <div class="rating-text" id="ratingText"></div>
                <input type="hidden" id="rating" name="rating" value="0">
            </div>

            <button type="submit">Create Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/">Login here</a>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Password Strength Indicator
            $('#password').on('input', function() {
                const password = $(this).val();
                const strengthBar = $('#passwordStrengthBar');
                const strengthText = $('#strengthText');
                const strengthContainer = $('#passwordStrength');

                if (password.length === 0) {
                    strengthContainer.hide();
                    strengthText.hide();
                    return;
                }

                strengthContainer.show();
                strengthText.show();

                let strength = 0;
                let strengthLabel = '';
                let strengthClass = '';

                // Calculate password strength
                if (password.length >= 8) strength++;
                if (password.match(/[a-z]/)) strength++;
                if (password.match(/[A-Z]/)) strength++;
                if (password.match(/[0-9]/)) strength++;
                if (password.match(/[^a-zA-Z0-9]/)) strength++;

                // Determine strength level
                if (strength <= 2) {
                    strengthLabel = 'Weak';
                    strengthClass = 'weak';
                    strengthBar.css('width', '33%');
                } else if (strength <= 4) {
                    strengthLabel = 'Medium';
                    strengthClass = 'medium';
                    strengthBar.css('width', '66%');
                } else {
                    strengthLabel = 'Strong';
                    strengthClass = 'strong';
                    strengthBar.css('width', '100%');
                }

                strengthBar.removeClass('weak medium strong').addClass(strengthClass);
                strengthText.removeClass('weak medium strong').addClass(strengthClass);
                strengthText.text('Password Strength: ' + strengthLabel);
            });

            // Star Rating System
            let selectedRating = 0;

            $('.star').on('click', function() {
                selectedRating = $(this).data('value');
                $('#rating').val(selectedRating);
                updateStars(selectedRating);
                updateRatingText(selectedRating);
            });

            $('.star').on('mouseenter', function() {
                const hoverValue = $(this).data('value');
                $('.star').each(function() {
                    if ($(this).data('value') <= hoverValue) {
                        $(this).addClass('hovered');
                    } else {
                        $(this).removeClass('hovered');
                    }
                });
            });

            $('#starRating').on('mouseleave', function() {
                $('.star').removeClass('hovered');
                updateStars(selectedRating);
            });

            function updateStars(rating) {
                $('.star').each(function() {
                    if ($(this).data('value') <= rating) {
                        $(this).addClass('active');
                    } else {
                        $(this).removeClass('active');
                    }
                });
            }

            function updateRatingText(rating) {
                const texts = {
                    1: 'Rarely reads',
                    2: 'Occasional reader',
                    3: 'Regular reader',
                    4: 'Avid reader',
                    5: 'Bookworm!'
                };
                $('#ratingText').text(texts[rating] || '');
            }

            // Form Submission
            $('#registrationForm').on('submit', function(e) {
                e.preventDefault();

                // Collect form data
                const formData = {
                    fullname: $('#fullname').val(),
                    email: $('#email').val(),
                    username: $('#username').val(),
                    password: $('#password').val(),
                    rating: $('#rating').val()
                };

                console.log('Registration Data:', formData);

                // Send to backend
                fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Store user data
                        localStorage.setItem('user', JSON.stringify(data.user));
                        localStorage.setItem('token', data.token);
                        
                        // Show success message
                        $('#successMessage').text('Registration successful! Redirecting to your profile...').slideDown();
                        
                        // Redirect to profile page
                        setTimeout(function() {
                            window.location.href = '/?page=profile';
                        }, 2000);
                    } else {
                        alert('Registration failed: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error connecting to server. Please try again.');
                });
            });
        });
    </script>
</body>
</html>
